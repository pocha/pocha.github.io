# Winter 2026 candidate routes. Geometry lives in assets/data/routes/<key>.json (road-snapped via Valhalla, motorcycle profile).
- key: uk
  title: "Uttarakhand Pilgrimage & Hills Circuit"
  description: "A loop from Delhi through Uttarakhand's holiest places (Gangotri, Kedarnath and Badrinath) and the Kumaon hills, with a Kedarnath trek and time to shoot content along the way."
  color: "#2f9e44"
  days: 27
  stops: 22
  km: 2500
  trek: "About 31 km on foot (Gaurikund to Kedarnath and back, roughly 16 km each way), plus an optional short Tungnath hike from Chopta (about 3.5 km each way)."
  note: "Kedarnath, Gangotri and Badrinath shrines typically close in early-to-mid November, so this circuit is timed to reach them before closure. Road and weather conditions will be checked before the ride."
  itinerary:
    - day: 1
      type: ride
      route: "Delhi → Rishikesh"
      km: 220
      see: "Roorkee and Haridwar on the way, then the Ganga aarti at Rishikesh"
    - day: 2
      type: shoot
      route: "Rishikesh"
      km: 0
      note: "Content day: Laxman Jhula, Ganga aarti, riverside cafes"
      see: "Laxman Jhula, Ram Jhula, Triveni Ghat aarti, riverside cafes"
    - day: 3
      type: ride
      route: "Rishikesh → Chakrata"
      km: 129
      see: "The Doon valley, the Ashokan rock edict at Kalsi, forest road up to Chakrata"
    - day: 4
      type: ride
      route: "Chakrata → Mussoorie"
      km: 78
      note: "Short day, time to shoot on the way"
      see: "Tiger Falls and the Deoban forests near Chakrata, then the climb to Mussoorie"
    - day: 5
      type: shoot
      route: "Mussoorie"
      km: 0
      note: "Content day: Mall Road, Kempty Falls, Landour"
      see: "Mall Road, Kempty Falls, Landour, Lal Tibba"
    - day: 6
      type: ride
      route: "Mussoorie → Uttarkashi"
      km: 167
      see: "Dhanaulti's deodar forests, Chamba and the Bhagirathi valley"
    - day: 7
      type: ride
      route: "Uttarkashi → Gangotri → Harsil Valley"
      km: 125
      legs:
        - {to: Gangotri, km: 100, type: ride}
        - {to: Harsil Valley, km: 25, type: ride}
      note: "Gangotri darshan, overnight at Harsil"
      see: "Gangnani hot springs, Harsil and Dharali, then Gangotri temple"
    - day: 8
      type: shoot
      route: "Harsil Valley"
      km: 0
      note: "Rest and content day: apple orchards, Dharali, Mukhba"
      see: "Apple orchards, Dharali, Mukhba (Gangotri's winter seat)"
    - day: 9
      type: ride
      route: "Harsil Valley → New Tehri"
      km: 191
      see: "Back down the Bhagirathi valley through Uttarkashi and Chamba to New Tehri"
    - day: 10
      type: shoot
      route: "New Tehri"
      km: 0
      note: "Rest and content day: Tehri Lake and dam, water sports at Koti Colony"
      see: "Tehri Lake and dam, water sports at Koti Colony"
    - day: 11
      type: ride
      route: "New Tehri → Guptkashi"
      km: 153
      see: "Srinagar (Garhwal) on the Alaknanda, Rudraprayag confluence, Agastyamuni"
    - day: 12
      type: trek
      route: "Guptkashi → Gaurikund → Kedarnath (trek)"
      km: 33
      trek_km: 16
      note: "Trek up about 16 km on foot and stay overnight at Kedarnath (book accommodation ahead)"
      see: "Sonprayag and Gaurikund, then the trek via Rambara and Linchauli to Kedarnath temple"
    - day: 13
      type: trek
      route: "Kedarnath → Gaurikund (trek) → Guptkashi"
      km: 33
      trek_km: 16
      note: "Morning content at the temple, then trek down about 16 km on foot"
      see: "Sunrise and morning aarti at Kedarnath, Bhairavnath temple, trek down"
    - day: 14
      type: shoot
      route: "Guptkashi → Chopta"
      km: 39
      note: "Short ride, then afternoon shoot and optional Tungnath hike (about 3.5 km each way)"
      see: "Ukhimath (Kedarnath's winter seat), Chopta meadows, optional Tungnath hike"
    - day: 15
      type: ride
      route: "Chopta → Badrinath"
      km: 161
      see: "Gopeshwar, Chamoli, Joshimath and Vishnuprayag on the way to Badrinath"
    - day: 16
      type: shoot
      route: "Badrinath"
      km: 0
      note: "Rest and content day: Badrinath temple, Mana village, Tapt Kund"
      see: "Badrinath temple, Tapt Kund, Mana village, Bhim Pul"
    - day: 17
      type: ride
      route: "Badrinath → Karnaprayag"
      km: 125
      see: "Joshimath, Vishnuprayag and Nandaprayag confluences"
    - day: 18
      type: ride
      route: "Karnaprayag → Kausani"
      km: 107
      see: "Adi Badri temples and the pine forests of Gwaldam"
    - day: 19
      type: shoot
      route: "Kausani"
      km: 0
      note: "Rest and content day: Himalayan panorama, tea gardens, Anasakti Ashram"
      see: "Himalayan panorama (Trishul, Nanda Devi), tea gardens, Anasakti Ashram"
    - day: 20
      type: ride
      route: "Kausani → Munsiyari"
      km: 150
      see: "Baijnath temples, Bageshwar, the Gori valley"
    - day: 21
      type: shoot
      route: "Munsiyari"
      km: 0
      note: "Content day: Panchachuli views, Khaliya Top, Tribal Heritage Museum"
      see: "Panchachuli views, Khaliya Top, Tribal Heritage Museum"
    - day: 22
      type: ride
      route: "Munsiyari → Pithoragarh"
      km: 139
      note: "Far-east point of the ride"
      see: "Birthi Falls, Thal, Didihat"
    - day: 23
      type: ride
      route: "Pithoragarh → Abbott Mount → Binsar"
      km: 191
      legs:
        - {to: Abbott Mount, km: 57, type: ride}
        - {to: Binsar, km: 134, type: ride}
      see: "Pithoragarh fort, Abbott Mount's colonial cottages, then Almora and Binsar"
    - day: 24
      type: ride
      route: "Binsar → Mukteshwar → Kainchi Dham"
      km: 121
      legs:
        - {to: Mukteshwar, km: 72, type: ride}
        - {to: Kainchi Dham, km: 49, type: ride}
      note: "Shoot at Mukteshwar on the way"
      see: "Binsar Zero Point, Mukteshwar Dham and Chauli ki Jali, then Kainchi Dham"
    - day: 25
      type: shoot
      route: "Kainchi Dham → Nainital"
      km: 27
      note: "Morning at Kainchi Dham, afternoon content at Naini Lake and Mall Road"
      see: "Kainchi Dham ashram in the morning, then Naini Lake and Mall Road"
    - day: 26
      type: shoot
      route: "Nainital → Jim Corbett"
      km: 63
      note: "Short ride, then safari content at Corbett"
      see: "Kaladhungi, Corbett Falls, jungle safari at Jim Corbett"
    - day: 27
      type: ride
      route: "Jim Corbett → Delhi"
      km: 260
      see: "Long plains highway via Moradabad and Hapur back to Delhi"
  stop_names:
    - "Delhi (Start)"
    - "Rishikesh"
    - "Chakrata (Deoban / Budher Caves)"
    - "Mussoorie"
    - "Uttarkashi"
    - "Gangotri"
    - "Harsil Valley"
    - "New Tehri (Tehri Lake)"
    - "Guptkashi"
    - "Gaurikund (Kedarnath trek starts)"
    - "Chopta (Tungnath trek starts)"
    - "Badrinath"
    - "Karnaprayag"
    - "Kausani"
    - "Munsiyari (Panchachuli Base)"
    - "Pithoragarh"
    - "Abbott Mount (Champawat)"
    - "Binsar Wildlife Sanctuary"
    - "Mukteshwar"
    - "Kainchi Dham (Neem Karoli Baba Ashram)"
    - "Nainital"
    - "Jim Corbett National Park (Ramnagar)"
    - "Delhi (End)"
- key: rj
  title: "Rajasthan Circuit"
