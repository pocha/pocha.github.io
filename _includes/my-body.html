<!--
Code for integrating CloudFlare's email protection with Hydejack's single page app loading.
-->
<script>
  document.getElementById('_pushState').addEventListener('hy-push-state-after', function (e) {
    function e(e){
      (console.error?console.error:console.log).call(console,e)
    }

    function t(e){
      return l.innerHTML='<a href="'+e.replace(/"/g,"&quot;")+'"></a>',l.childNodes[0].getAttribute("href")
    }

    function r(e,t){
      var r=e.substr(t,2);return parseInt(r,16)
    }

    function n(e,n){
      for(var o="",c=r(e,n),a=n+2;a<e.length;a+=2){
        var l=r(e,a)^c;
        o+=String.fromCharCode(l)
      }
      return t(o)
    }

    var o="/cdn-cgi/l/email-protection#",
        c=".__cf_email__",
        a="data-cfemail",
        l=document.createElement("div");

    !function(){
      for(var t=document.getElementsByTagName("a"),r=0;r<t.length;r++)
        try{
          var c=t[r],a=c.href.indexOf(o);
          a>-1&&(c.href="mailto:"+n(c.href,a+o.length))
        }catch(t){
          e(t)
        }
    }(),
    function(){
      for(var t=document.querySelectorAll(c),r=0;r<t.length;r++)
        try{
          var o=t[r],l=n(o.getAttribute(a),0),i=document.createTextNode(l);
          o.parentNode.replaceChild(i,o)
        }catch(t){
          e(t)
        }
    }()
  });
</script>

<!--
Example code for using Matamo as alternative analytics solution.
-->
{% if site.matomo_analytics %}
<script>
  var _paq = _paq || [];

  /*{% if site.matomo_analytics.no_cookies %}*/
  _paq.push(['disableCookies']);
  /*{% endif %}*/

  _paq.push(['trackPageView']);
  _paq.push(['enableLinkTracking']);
  _paq.push(['setTrackerUrl', u+'piwik.php']);
  _paq.push(['setSiteId', '{{site.matomo_analytics.site_id}}']);

  var pushStateEl = document.getElementById('_pushState');
  var timeStartLoadPage, referer, timeItTookToLoadPage;

  pushStateEl.addEventListener('hy-push-state-start', function() {
    timeStartLoadPage = new Date().getTime();
    referer = window.location.toString();
  });

  pushStateEl.addEventListener('hy-push-state-ready', function() {
    timeItTookToLoadPage = new Date().getTime() - timeStartLoadPage;
  });

  pushStateEl.addEventListener('hy-push-state-after', function() {
    _paq.push(['setReferrerUrl', referer]);
    _paq.push(['setCustomUrl', window.location.toString()]);
    _paq.push(['setDocumentTitle', document.title]);
    _paq.push(['deleteCustomVariables', 'page']);
    _paq.push(['setGenerationTimeMs', timeItTookToLoadPage]);
    _paq.push(['trackPageView']);
  });

  window.loadJSDeferred('{{site.matomo_analytics.root}}piwik.js');
</script>
{% endif %}
{% endcomment %}


<!-- Interactive route maps (Leaflet) for any `.route-map` element on the page. -->
<script>
  (function () {
    var LEAFLET = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/';
    var loading;

    function loadLeaflet() {
      if (window.L) return Promise.resolve();
      if (loading) return loading;
      loading = new Promise(function (resolve, reject) {
        var css = document.createElement('link');
        css.rel = 'stylesheet';
        css.href = LEAFLET + 'leaflet.css';
        document.head.appendChild(css);
        var js = document.createElement('script');
        js.src = LEAFLET + 'leaflet.js';
        js.onload = resolve;
        js.onerror = reject;
        document.head.appendChild(js);
      });
      return loading;
    }

    function initMap(el) {
      if (el.dataset.ready) return;
      el.dataset.ready = '1';
      var color = el.dataset.color || '#1c7ed6';
      fetch(el.dataset.src).then(function (r) { return r.json(); }).then(function (data) {
        var map = L.map(el, { scrollWheelZoom: false, dragging: !L.Browser.mobile });
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 18,
          attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);
        L.polyline(data.line, { color: '#fff', weight: 8, opacity: 0.9 }).addTo(map);
        var line = L.polyline(data.line, { color: color, weight: 4.5, opacity: 1 }).addTo(map);
        (data.treks || []).forEach(function (t) {
          L.polyline(t.line, { color: '#111', weight: 4, dashArray: '2 8', lineCap: 'round' })
            .addTo(map)
            .bindPopup('<b>' + t.name + '</b><br>' + (t.approx ? '~' : '') + t.km + ' km one way, on foot');
        });
        data.stops.forEach(function (s, i) {
          var last = i === data.stops.length - 1;
          if (last && s[0] === data.stops[0][0] && s[1] === data.stops[0][1]) return;
          var icon = L.divIcon({
            className: '',
            iconSize: [14, 14],
            html: '<div class="route-dot" style="background:' + (i === 0 ? '#111' : color) + '"></div>'
          });
          L.marker([s[0], s[1]], { icon: icon }).addTo(map).bindPopup(s[2]);
        });
        map.fitBounds(line.getBounds(), { padding: [20, 20] });
        /* Wheel-zoom only after the map has been clicked, so it doesn't hijack page scrolling. */
        map.on('focus', function () { map.scrollWheelZoom.enable(); });
        map.on('blur', function () { map.scrollWheelZoom.disable(); });
      });
    }

    function initAll() {
      var els = document.querySelectorAll('.route-map');
      if (!els.length) return;
      loadLeaflet().then(function () {
        var io = 'IntersectionObserver' in window && new IntersectionObserver(function (entries) {
          entries.forEach(function (e) { if (e.isIntersecting) { io.unobserve(e.target); initMap(e.target); } });
        }, { rootMargin: '300px' });
        els.forEach(function (el) { io ? io.observe(el) : initMap(el); });
      });
    }

    document.addEventListener('DOMContentLoaded', initAll);
    if (document.readyState !== 'loading') initAll();
    document.getElementById('_pushState').addEventListener('hy-push-state-after', initAll);
  })();
</script>
